services:
  lessonflow-dev-mysql:
    image: mariadb:latest
    container_name: lessonflow-dev-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mgs_dev
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "/usr/bin/mariadb-admin", "ping", "-h", "127.0.0.1", "-u", "root", "-proot"]
      timeout: 10s
      retries: 10
      interval: 10s

  lessonflow-test-mysql:
    image: mariadb:latest
    container_name: lessonflow-test-mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mgs_test
    volumes:
      - mariadb_test_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "/usr/bin/mariadb-admin", "ping", "-h", "127.0.0.1", "-u", "root", "-proot"]
      timeout: 10s
      retries: 10
      interval: 10s

volumes:
  mariadb_data:
  mariadb_test_data:
