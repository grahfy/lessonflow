# Melbourne Guitar School - Nginx Configuration (HTTP only, pre-SSL)
# This config is used initially before SSL certificates are obtained.
# deploy.sh swaps to deploy/nginx.conf on later runs once cert files exist.

# Rate limiting zones. Keep these aligned with the HTTPS template so behavior is
# consistent before/after certbot switches the site into TLS mode.
limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=admin_ui:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

# Upstream for Next.js app (local Node process behind Nginx).
# The proxy_pass directives intentionally omit a trailing slash so request paths
# such as /api/admin/... reach Next.js unchanged.
upstream melbourne_guitar_school {
    server 127.0.0.1:3000;
    keepalive 64;
}

# Redirect www to non-www.
# Uses 308 to preserve request methods if an API call ever hits the wrong host.
server {
    listen 80;
    listen [::]:80;
    server_name www.melbourneguitarschool.com.au;
    return 308 https://melbourneguitarschool.com.au$request_uri;
}

    # Main server (HTTP bootstrap only). Once SSL is provisioned, deploy.sh will
    # install the HTTPS template instead of this file.
server {
    listen 80;
    listen [::]:80;
    server_name melbourneguitarschool.com.au;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Root and index
    root /var/www/melbourne-guitar-school/current/public;
    index index.html;

    # Allow uploads larger than the nginx default (1MB) so learning-material
    # uploads can reach the app-level 100MB validation.
    client_max_body_size 128m;

    # Static files and images
    location /images/ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
        try_files $uri =404;
    }

    location /favicon.ico {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
        try_files $uri =404;
    }

    location /robots.txt {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
        try_files $uri =404;
    }

    # Public assets (fallback for legacy or direct /public references)
    location /public/ {
        expires 7d;
        alias /var/www/melbourne-guitar-school/current/public/;
        add_header Cache-Control "public, max-age=604800";
    }

    # Static file caching
    location /_next/static {
        alias /var/www/melbourne-guitar-school/current/.next/static;
        expires 365d;
        add_header Cache-Control "public, immutable, max-age=31536000";
        access_log off;
    }

    # Public assets
    location /public {
        alias /var/www/melbourne-guitar-school/current/public;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # Learning materials (authenticated downloads handled by app)
    location /api/materials {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://melbourne_guitar_school;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Login endpoints only - strict rate limiting (protects brute force targets).
    # Exact-match blocks are ordered before broader regex/API locations.
    location = /api/admin/login {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://melbourne_guitar_school;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location = /api/student/login {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://melbourne_guitar_school;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location = /admin/login {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass http://melbourne_guitar_school;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location = /student/login {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass http://melbourne_guitar_school;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Admin and setup pages/APIs - moderate rate limiting for console usage.
    location ~ ^/(admin|api/admin|setup) {
        limit_req zone=admin_ui burst=20 nodelay;
        proxy_pass http://melbourne_guitar_school;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Student portal pages/APIs - moderate rate limiting for normal portal usage
    location ~ ^/(student|api/student) {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://melbourne_guitar_school;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # API endpoints - moderate rate limiting.
    location /api {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://melbourne_guitar_school;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Main application fallback proxied to Next.js with forwarded headers.
    location / {
        limit_req zone=general burst=20 nodelay;
        proxy_pass http://melbourne_guitar_school;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Deny access to sensitive files
    location ~ \.(env|log|bak|sql|db)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Custom error pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /var/www/melbourne-guitar-school/current/public;
        internal;
    }

    # Access and error logs
    access_log /var/log/nginx/melbourne-guitar-school.access.log;
    error_log /var/log/nginx/melbourne-guitar-school.error.log warn;
}
