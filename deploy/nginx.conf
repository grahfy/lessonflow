# Melbourne Guitar School - Nginx Configuration
# Install: sudo cp deploy/nginx.conf /etc/nginx/sites-available/melbourne-guitar-school
# Enable:  sudo ln -s /etc/nginx/sites-available/melbourne-guitar-school /etc/nginx/sites-enabled/
# Test:    sudo nginx -t
# Reload:  sudo systemctl reload nginx

# Rate limiting zones. Auth endpoints stay intentionally strict; admin_ui/api are
# higher to avoid false positives during normal console/calendar usage.
limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=admin_ui:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

# Upstream for Next.js app.
# `proxy_pass http://melbourne_guitar_school;` references this upstream name
# (not public DNS) and preserves the original URI because no trailing slash is
# used in the proxy_pass directives below.
upstream melbourne_guitar_school {
    server 127.0.0.1:3000;
    keepalive 64;
}

# Redirect www to non-www (HTTP)
server {
    listen 80;
    listen [::]:80;
    server_name www.melbourneguitarschool.com.au;
    return 308 https://melbourneguitarschool.com.au$request_uri;
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name melbourneguitarschool.com.au;
    return 308 https://$server_name$request_uri;
}

# Redirect www to non-www (HTTPS)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.melbourneguitarschool.com.au;

    ssl_certificate /etc/letsencrypt/live/melbourneguitarschool.com.au/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/melbourneguitarschool.com.au/privkey.pem;

    return 308 https://melbourneguitarschool.com.au$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name melbourneguitarschool.com.au;

    # SSL Configuration (update paths after certbot setup)
    ssl_certificate /etc/letsencrypt/live/melbourneguitarschool.com.au/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/melbourneguitarschool.com.au/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    # Modern SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # HSTS
    add_header Strict-Transport-Security "max-age=63072000" always;

    # Security headers (complement Next.js headers)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Root and index
    root /var/www/melbourne-guitar-school/current/public;
    index index.html;

    # Allow uploads larger than the nginx default (1MB) so learning-material
    # uploads can reach the Next.js route, which enforces its own 100MB limit.
    client_max_body_size 128m;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Static file caching
    location /_next/static {
        alias /var/www/melbourne-guitar-school/current/.next/static;
        expires 365d;
        add_header Cache-Control "public, immutable, max-age=31536000";
        access_log off;
    }

    # Static files and images
    location /images/ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
        try_files $uri =404;
    }

    location /favicon.ico {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
        try_files $uri =404;
    }

    location /robots.txt {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
        try_files $uri =404;
    }

    # Public assets (fallback for legacy or direct /public references)
    location /public/ {
        expires 7d;
        alias /var/www/melbourne-guitar-school/current/public/;
        add_header Cache-Control "public, max-age=604800";
    }

    # Learning materials (authenticated downloads handled by app).
    # Keep these under proxying so the app can authorize access before file read.
    location /api/materials {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://melbourne_guitar_school;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Login endpoints only - strict rate limiting (protects brute force targets).
    # These exact-match blocks must appear before broader /api and admin regex
    # locations so they get the stricter auth zone.
    location = /api/admin/login {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://melbourne_guitar_school;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location = /api/student/login {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://melbourne_guitar_school;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location = /admin/login {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass http://melbourne_guitar_school;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location = /student/login {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass http://melbourne_guitar_school;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Admin and setup pages/APIs - moderate rate limiting for console usage.
    # This prevents the admin console's bursty fetch pattern from tripping the
    # login-specific auth throttle while still limiting abusive traffic.
    location ~ ^/(admin|api/admin|setup) {
        limit_req zone=admin_ui burst=20 nodelay;
        proxy_pass http://melbourne_guitar_school;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Student portal pages/APIs - moderate rate limiting for normal portal usage
    location ~ ^/(student|api/student) {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://melbourne_guitar_school;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # API endpoints - moderate rate limiting.
    # Placed after more specific login/admin/student locations so those paths use
    # their dedicated limits and diagnostics-friendly proxy headers.
    location /api {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://melbourne_guitar_school;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Main application fallback. All non-static/public requests are proxied to
    # the Next.js server with forwarded headers preserved for auth/session logic.
    location / {
        limit_req zone=general burst=20 nodelay;
        proxy_pass http://melbourne_guitar_school;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Deny access to sensitive files
    location ~ \.(env|log|bak|sql|db)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Custom error pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /var/www/melbourne-guitar-school/current/public;
        internal;
    }

    # Access and error logs
    access_log /var/log/nginx/melbourne-guitar-school.access.log;
    error_log /var/log/nginx/melbourne-guitar-school.error.log warn;
}
